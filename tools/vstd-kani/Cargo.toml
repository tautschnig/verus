[package]
name = "vstd-kani"
version = "0.0.0"
edition = "2021"
description = "Kani falsification harnesses for Verus vstd assume_specification contracts against real Rust std. See ../STUDY.md."
publish = false

# No dependencies: harnesses call std directly and re-implement the vstd spec
# postconditions as executable Rust, then check them against real std behaviour.
[dependencies]

[lib]
path = "src/lib.rs"
